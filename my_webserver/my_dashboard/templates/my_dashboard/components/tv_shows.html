<div id="tvshow-container">
  <div class="row align-items-start mb-3">
    <div class="col-10">
      <div class="card py-1">
        <div class="card-header row pb-2 mx-0">
          <div class="col-11">
            <a data-bs-toggle="collapse" href="#tv-show-table" class="link-body-emphasis link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">
              <h2>
                Today's TV Schedule
                <i class="rotatable-section-header bi bi-chevron-down pull-left me-2"></i>
              </h2>
            </a>
          </div>
          <div class="col-1">
            <h3 class="py-1 ms-5"><i id="tvshow-container-refresh" class="fa bi bi-arrow-clockwise"></i></h3>
          </div>
        </div>
        <div class="collapse show" id="tv-show-table">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Show Name</th>
                <th>Episode Name</th>
                <th>Posted</th>
                <th>Favorite</th>
              </tr>
            </thead>
            <tbody>
              {% for entry in tv_shows %}
                <tr class="{% if entry.favorite %}table-warning{% endif %}">
                  <td>
                    <a class="link-dark link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="{{ entry.episode_url }}" target="_blank">{{ entry.show_name }}</a>
                  </td>
                  <td>{{ entry.episode_name }}</td>
                  <td>{{ entry.time_posted }}</td>
                  <td>
                    {% if not entry.favorite %}
                      <a href="{{ entry.favorite_url }}"><i class="bi bi-star"></i></a>
                    {% else %}
                      <a href="{{ entry.favorite_url }}"><i class="bi bi-star-fill"></i></a>
                    {% endif %}
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
