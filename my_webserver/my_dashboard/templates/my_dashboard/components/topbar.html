<div class="row align-items-start mb-3 bg-secondary text-white">
    <div class="col">
        <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
            <div class="container-fluid">
                {% if topbar.headset %}
                <div id="navElHeadset">
                    <table class="table-sm bg-secondary">
                        <tbody>
                            <tr>
                                <td>
                                    <span class="navbar-brand">{{ topbar.headset.name }}</span>
                                </td>
                                <td>
                                    <i class="bi bi-{{ topbar.headset.icon }} navbar-brand"></i>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <span class="navbar-text">{{ topbar.headset.text }}</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    {% comment %}                     
                    <span class="navbar-text">Logitech G533</span>
                    <i class="bi bi-battery"></i>
                    <i class="bi bi-battery-half"></i>
                    <i class="bi bi-battery-full"></i>
                    <i class="bi bi-battery-charging"></i>
                    <span class="navbar-text">Battery: 100%</span>
                    {% endcomment %}
                </div>
                {% endif %}
            </div>
        </nav>
    </div>
</div>
