<div class="row align-items-start">
    <div class="col-10">
        <h2>Recent Movies</h2>
        <table class="table table-striped">
            <thead>
                <th>Name</th>
                <th>Year</th>
                <th>Resolutions</th>
                <th>Groups</th>
            </thead>
            <tbody>
                {% for movie in movies %}
                <tr>
                    <td><a href="{{ movie.href }}">{{ movie.name }}</a></td>
                    <td>{{ movie.year }}</td>
                    <td>{{ movie.resolutions }}</td>
                    <td>{{ movie.groups }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
