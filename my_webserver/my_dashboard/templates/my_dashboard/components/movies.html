<div class="row align-items-start mb-3">
  <div class="col-10">
    <div class="card p-1">
      <div class="card-header">
        <h2>
          <a data-bs-toggle="collapse" href="#movies-table" class="link-body-emphasis link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">
            <i class="rotatable-section-header bi bi-chevron-down pull-left me-2"></i>
            Recent Movies
          </a>
        </h2>
      </div>
      <div class="collapse show" id="movies-table">
        <table class="table table-striped">
          <thead>
            <th>Name</th>
            <th>Year</th>
            <th>Resolutions</th>
            <th>Groups</th>
          </thead>
          <tbody>
            {% for movie in movies %}
              <tr>
                <td>
                  <a href="{{ movie.href }}" target="_blank" class="link-dark link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover">{{ movie.name }}</a>
                </td>
                <td>{{ movie.year }}</td>
                <td>{{ movie.resolutions }}</td>
                <td>{{ movie.groups }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
